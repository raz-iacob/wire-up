name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Add Flux license
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Package assets
        run: |
          tar -czf build.tar.gz -C public build
          sha256sum build.tar.gz | cut -d ' ' -f 1 > build.tar.gz.sha256

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            index($0, "## " tag " ") == 1 || $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found && NF { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $TAG"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build.tar.gz --clobber
            gh release upload "$TAG" build.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" build.tar.gz build.tar.gz.sha256 --verify-tag --title "$TAG" --notes-file notes.md
          fi
